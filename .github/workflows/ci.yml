name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf gcc qemu-system-misc cppcheck

      - name: Fetch Unity test framework
        run: |
          # v2.6.3 was never tagged upstream; pin the commit that reports UNITY 2.6.3.
          git clone --depth 1 --no-checkout https://github.com/ThrowTheSwitch/Unity.git test/Unity
          git -C test/Unity fetch --depth 1 origin b706271f3255e33a0e5ec068844462c5fdb5c527
          git -C test/Unity checkout b706271f3255e33a0e5ec068844462c5fdb5c527

      - name: Build release firmware
        run: |
          make clean && make
          chmod +x scripts/check_firmware_size.sh scripts/report_memory_map.sh
          scripts/check_firmware_size.sh release dist/release/kernel.elf
          scripts/report_memory_map.sh release dist/release/kernel.elf dist/release/kernel.map \
            | tee dist/release/memory_report.txt

      - name: Host tests and static analysis
        run: |
          mkdir -p dist/ci-logs
          make test 2>&1 | tee dist/ci-logs/test.log
          make lint 2>&1 | tee dist/ci-logs/lint.log

      - name: QEMU smoke test (release)
        run: make qemu-smoke KERNEL_BIN=dist/release/kernel.bin

      - name: QEMU soak test (release)
        run: make qemu-soak KERNEL_BIN=dist/release/kernel.bin

      - name: Build DEBUG firmware
        run: |
          make debug
          scripts/check_firmware_size.sh debug dist/debug/kernel.elf
          scripts/report_memory_map.sh debug dist/debug/kernel.elf dist/debug/kernel.map \
            | tee dist/debug/memory_report.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload CI logs
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.sha }}
          path: dist/ci-logs/
          if-no-files-found: error
          retention-days: 14