name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf gcc qemu-system-misc cppcheck

      - name: Fetch Unity test framework
        run: |
          # v2.6.3 was never tagged upstream; pin the commit that reports UNITY 2.6.3.
          git clone --depth 1 --no-checkout https://github.com/ThrowTheSwitch/Unity.git test/Unity
          git -C test/Unity fetch --depth 1 origin b706271f3255e33a0e5ec068844462c5fdb5c527
          git -C test/Unity checkout b706271f3255e33a0e5ec068844462c5fdb5c527

      - name: Build release firmware
        run: |
          make clean && make
          mkdir -p dist/release
          cp kernel.elf kernel.bin dist/release/
          riscv64-unknown-elf-size kernel.elf | tee dist/release/size.txt
          chmod +x scripts/check_firmware_size.sh
          scripts/check_firmware_size.sh release kernel.elf

      - name: Build DEBUG firmware
        run: |
          make clean && make debug
          mkdir -p dist/debug
          cp kernel.elf kernel.bin dist/debug/
          riscv64-unknown-elf-size kernel.elf | tee dist/debug/size.txt
          scripts/check_firmware_size.sh debug kernel.elf

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Run Unity tests
        run: make test

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,style,performance,portability --inconclusive --inline-suppr --quiet \
            -Iinclude \
            -IFreeRTOS/Source/include \
            -IFreeRTOS/Source/portable/GCC/RISC-V \
            --suppressions-list=cppcheck-suppressions.txt \
            --suppress=missingIncludeSystem \
            --error-exitcode=1 \
            src/

      - name: QEMU smoke test
        run: |
          set +e
          timeout 10s make qemu
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then
            echo "QEMU smoke test OK (exit code ${code})"
            exit 0
          fi
          exit "$code"